spring.application.name=spacehealth-backend
server.port=8080

# Folder holding rules.json, seed.json, triage_protocol.json and schemas/ (relative to where the app is started).
contract.dir=../contract

# Angular dev server. Comma-separated list.
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# Countermeasure planner. The key is read from the environment; without it the offline planner is used.
planner.gemini.api-key=${GEMINI_API_KEY:}
planner.gemini.model=gemini-2.5-flash
planner.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
planner.gemini.timeout-seconds=20
planner.gemini.thinking-budget=0
planner.default-mass-kg=80

@if (figure(); as f) {
  <figure class="m-0">
    <svg viewBox="0 0 240 160" role="img" [attr.aria-label]="f.caption" class="block w-full h-auto">
      <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M1 1 L7 4 L1 7" fill="none" stroke="var(--color-signal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
      </defs>

      <!-- drafting grid -->
      <g class="grid">
        <path d="M0 40H240M0 80H240M0 120H240M40 0V160M80 0V160M120 0V160M160 0V160M200 0V160" />
      </g>

      <!-- equipment behind the body -->
      @switch (f.scene) {
        @case ('ared') {
          <path class="gear" d="M52 140H196" />
          <rect class="gear-fill" x="66" y="70" width="14" height="70" rx="3" />
          <path class="gear" d="M73 70V56M73 60L131 60" />
          <circle class="accent" cx="131" cy="60" r="4" />
          <path class="gear" d="M98 140V134H160V140" />
          <path class="motion" d="M168 62V100" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        }
        @case ('cycle') {
          <path class="gear" d="M40 142H204" />
          <path class="gear" d="M72 46L90 100" />
          <path class="gear-fill" d="M138 142L146 112H156L164 142Z" />
          <circle class="gear" cx="150" cy="112" r="14" />
          <path class="gear" d="M141 123L160 101" />
          <path class="gear" d="M132 60L132 96L146 110" />
          <path class="motion" d="M172 96A26 26 0 0 1 166 132" marker-end="url(#arrow)" />
        }
        @case ('treadmill') {
          <rect class="gear-fill" x="52" y="132" width="140" height="10" rx="5" />
          <path class="gear" d="M64 137H180" stroke-dasharray="2 6" />
          <path class="accent" d="M112 90L98 132M124 90L142 132" />
          <path class="accent" d="M110 88H126" stroke-width="4" />
          <path class="motion" d="M176 124H206" marker-end="url(#arrow)" />
        }
        @case ('compact') {
          <path class="gear" d="M40 142H210" />
          <rect class="gear-fill" x="172" y="96" width="30" height="46" rx="4" />
          <path class="gear" d="M170 106V134" stroke-width="4" />
          <path class="accent" d="M148 84L172 104" />
          <circle class="gear" cx="187" cy="110" r="6" />
          <path class="motion" d="M112 56H150" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        }
        @case ('surface') {
          <path class="gear" d="M16 142Q120 126 224 142" />
          <ellipse class="gear" cx="62" cy="142" rx="12" ry="2.5" />
          <ellipse class="gear" cx="188" cy="143" rx="8" ry="2" />
          <rect class="gear-fill" x="102" y="54" width="12" height="28" rx="3" />
          <circle class="gear" cx="122" cy="40" r="13" />
          <path class="motion" d="M150 100V124" marker-end="url(#arrow)" />
          <circle class="gear" cx="204" cy="30" r="9" />
          <path class="gear" d="M198 27Q204 31 210 28" />
        }
        @case ('stretch') {
          <path class="gear" d="M52 140H196" />
          <path class="accent" d="M102 128H136" stroke-width="3" />
          <path class="gear" d="M104 128V140M134 128V140" />
          <path class="motion" d="M158 70A44 44 0 0 0 176 46" marker-end="url(#arrow)" />
        }
        @case ('cuff') {
          <path class="motion" d="M176 60Q130 26 88 40" marker-end="url(#arrow)" />
        }
        @case ('compression') {
          <path class="gear" d="M52 140H196" />
          <rect class="gear-fill" x="134" y="38" width="12" height="16" rx="2" />
          <path class="gear" d="M140 38V30L134 28" />
        }
        @case ('circadian') {
          <rect class="gear-fill" x="76" y="16" width="96" height="7" rx="2" />
          <path class="motion" d="M92 28L84 48M124 28V46M156 28L164 48" />
          <rect class="gear-fill" x="146" y="66" width="20" height="24" rx="2" transform="rotate(14 156 78)" />
          <circle class="accent" cx="204" cy="44" r="6" />
          <path class="accent" d="M204 32V34M204 54V56M192 44H194M214 44H216" />
          <path class="motion" d="M204 62V100" marker-end="url(#arrow)" />
          <path class="gear" d="M208 110A8 8 0 1 1 200 118A6 6 0 0 0 208 110Z" />
        }
        @case ('swab') {
          <path class="gear" d="M36 140H196" />
          <path class="gear" d="M178 20V140" />
          <rect class="gear-fill" x="178" y="50" width="24" height="56" rx="2" />
          <path class="gear" d="M178 68H202M178 86H202M190 50V106" />
          <path class="accent" d="M158 68L176 72" />
          <rect class="gear-fill" x="48" y="112" width="26" height="28" rx="3" />
          <path class="motion" d="M54 104Q58 98 62 104T70 104M54 94Q58 88 62 94T70 94" />
        }
      }

      <!-- the figure: far limbs first so the near ones overlap them -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <polyline class="body-far" stroke-width="8" [attr.points]="line(f.pose.hip, f.pose.farLeg[0], f.pose.farLeg[1])" />
        <polyline class="body-far" stroke-width="6.5" [attr.points]="line(f.pose.shoulder, f.pose.farArm[0], f.pose.farArm[1])" />
        <polyline class="body" stroke-width="13" [attr.points]="line(f.pose.shoulder, f.pose.hip)" />
        <polyline class="body" stroke-width="8.5" [attr.points]="line(f.pose.hip, f.pose.nearLeg[0], f.pose.nearLeg[1])" />
        <polyline class="body" stroke-width="7" [attr.points]="line(f.pose.shoulder, f.pose.nearArm[0], f.pose.nearArm[1])" />
      </g>
      <circle [attr.cx]="f.pose.head[0]" [attr.cy]="f.pose.head[1]" r="9" fill="#dfe8f2" />

      <!-- parts worn on the body, drawn over it -->
      @switch (f.scene) {
        @case ('cuff') {
          <path d="M132.5 75.5L138.5 87" stroke="var(--color-signal)" stroke-width="6" fill="none" />
        }
        @case ('compression') {
          <g fill="none" stroke="var(--color-signal)" stroke-linejoin="round" stroke-dasharray="2 3.5">
            <polyline stroke-width="8.5" [attr.points]="line(f.pose.hip, f.pose.nearLeg[0], f.pose.nearLeg[1])" />
            <polyline stroke-width="13" points="119,72 119,92" />
          </g>
        }
        @case ('ared') {
          <circle class="accent" cx="131" cy="60" r="4" fill="#060a10" />
        }
      }

      <!-- numbered callouts -->
      @for (c of f.callouts; track c.label; let i = $index) {
        <circle class="tag" [attr.cx]="c.at[0]" [attr.cy]="c.at[1]" r="8" />
        <text class="tag-text" [attr.x]="c.at[0]" [attr.y]="c.at[1]">{{ i + 1 }}</text>
      }
    </svg>

    <figcaption class="mt-2 space-y-1">
      @for (c of f.callouts; track c.label; let i = $index) {
        <div class="flex gap-2 text-xs leading-5 text-ink-dim">
          <span class="num text-signal shrink-0">{{ i + 1 }}</span>
          <span>{{ c.label }}</span>
        </div>
      }
    </figcaption>
  </figure>
}
